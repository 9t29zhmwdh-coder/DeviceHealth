name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  DATABASE_URL: sqlite:./ci_check.db

permissions:
  contents: read

jobs:
  check:
    # Alle drei Zielplattformen, weil das Release fuer alle drei baut. Vorher
    # lief nur macOS: ein Fehler, der nur unter Windows oder Linux auftritt,
    # fiel erst beim Release auf, wenn ueberhaupt. Die AppImage- und
    # .exe-Artefakte gingen also ungeprueft raus.
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri baut unter Linux gegen GTK und WebKit. Der Runner bringt beides
      # nicht mit, und ohne diesen Schritt scheitert schon cargo check an
      # gobject-2.0. Der Release-Workflow installiert dieselben Pakete.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite
      - name: Prepare database
        run: |
          sqlx database create
          sqlx migrate run --source crates/dh-core/src/db/migrations
      - name: cargo check
        run: cargo check --workspace
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  # Baut die App und startet sie einmal wirklich.
  #
  # Bis hierher prueft die CI ausschliesslich, ob sich alles uebersetzen laesst.
  # Ein Programm, das compiliert und beim Start sofort abstuerzt, waere jede
  # Pruefung gruen durchlaufen und erst beim Nutzer aufgefallen. Kein Klickpfad,
  # keine Oberflaechenpruefung, nur die Frage, ob der Prozess nach ein paar
  # Sekunden noch lebt.
  smoke:
    # Alle drei Zielplattformen, weil das Release fuer alle drei baut. Vorher
    # lief nur macOS: ein Fehler, der nur unter Windows oder Linux auftritt,
    # fiel erst beim Release auf, wenn ueberhaupt. Die AppImage- und
    # .exe-Artefakte gingen also ungeprueft raus.
    name: Smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri baut unter Linux gegen GTK und WebKit. Der Runner bringt beides
      # nicht mit, und ohne diesen Schritt scheitert schon cargo check an
      # gobject-2.0. Der Release-Workflow installiert dieselben Pakete.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite
      - name: Prepare database
        run: |
          sqlx database create
          sqlx migrate run --source crates/dh-core/src/db/migrations

      - name: Build the application binary
        run: cargo build --bin devicehealth

      - name: Start it and see whether it stays up
        shell: bash
        run: |
          set -uo pipefail
          bin=target/debug/devicehealth

          # Unter Linux braucht das Fenster einen X-Server, sonst beendet sich
          # die App sofort und der Test meldete einen Fehler, den es ausserhalb
          # der CI nicht gibt.
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a "$bin" > start.log 2>&1 &
          else
            "$bin" > start.log 2>&1 &
          fi
          pid=$!

          # Fuenf Sekunden: lange genug fuer Fenster, WebView und die
          # Datenbankverbindung, kurz genug fuer die CI.
          sleep 5

          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Die Anwendung hat sich innerhalb von fuenf Sekunden beendet."
            echo "--- Ausgabe ---"
            cat start.log
            exit 1
          fi

          echo "Laeuft nach fuenf Sekunden noch, PID $pid."
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          # Eine Panic waere auch dann ein Fehler, wenn der Prozess ueberlebt:
          # ein abgestuerzter Hintergrund-Task faellt sonst nicht auf.
          if grep -qiE "panicked at|thread .* panicked" start.log; then
            echo "Panic beim Start:"
            cat start.log
            exit 1
          fi
          echo "--- Ausgabe ---"
          cat start.log

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck & build
        run: npm run build
        working-directory: frontend

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2026-0194/-0195: quick-xml DoS, transitiv via tauri->plist; kein Upstream-Fix
      # (>= quick-xml 0.41). Im Desktop-Kontext nicht exploitierbar. Entfernen sobald Tauri aktualisiert.
      - run: cargo audit --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite
      - name: Prepare database
        run: |
          sqlx database create
          sqlx migrate run --source crates/dh-core/src/db/migrations
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage
        run: cargo tarpaulin -p dh-core -p dh-cli --engine llvm --out Xml --timeout 120
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: cobertura.xml
          fail_ci_if_error: false
